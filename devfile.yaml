schemaVersion: 2.3.0
metadata:
  name: devspaces-chrome
components:
- name: dev-tools
  container:
    image: quay.io/cgruver0/che/chrome-devspaces-ubi10:latest
    memoryLimit: 6Gi
    cpuLimit: 1000m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    endpoints:
      - exposure: public
        name: kasmvnc
        targetPort: 8444
        secure: true
        attributes:
          # type: main
          cookiesAuthEnabled: true
          # discoverable: false
          urlRewriteSupported: true
- volume:
    size: 20Gi
  name: projects
