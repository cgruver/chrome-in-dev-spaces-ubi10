schemaVersion: 2.3.0
metadata:
  name: devspaces-chrome-oauth
components:
- name: dev-tools
  container:
    image: quay.io/cgruver0/che/chrome-devspaces-ubi10:latest
    memoryLimit: 6Gi
    cpuLimit: 1000m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    endpoints:
      - exposure: none
        name: kasmvnc
        targetPort: 8444
        protocol: http
- name: oauth-proxy
  container:
    image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
    args:
    - --http-address=:4180
    - --provider=openshift
    - --https-address=
    - --upstream=http://localhost:8444
    - --cookie-secret=SECRET
    - --cookie-secure=true
    - --pass-basic-auth=false
    - --skip-provider-button=true
    # - --openshift-service-account=$(DEVWORKSPACE_ID)-sa
    - --client-id=system:serviceaccount:${WORKSPACE_NAMESPACE}:wizard-oauth
    - --client-secret-file=/var/run/oauth-client/token
    - --openshift-ca=/etc/pki/tls/cert.pem
    - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    - --openshift-sar={"namespace":"${WORKSPACE_NAMESPACE}","resource":"pods","verb":"get"}
    endpoints:
      - exposure: internal
        name: oauth-proxy
        protocol: http
        targetPort: 4180
        attributes:
          discoverable: true
