schemaVersion: 2.3.0
metadata:
  name: devspaces-chrome-oauth
components:
- name: dev-tools
  container:
    image: quay.io/cgruver0/che/chrome-devspaces-ubi10:latest
    memoryLimit: 6Gi
    cpuLimit: 1000m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "$(PROJECT_SOURCE)/vscode.code-workspace"
    endpoints:
    - exposure: none
      name: kasmvnc
      targetPort: 8444
      protocol: http
- name: oauth-proxy
  attributes:
    workspace.devfile.io/service-account-annotations:
      serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"proxy"}}'
  container:
    image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
    command:
    - "/bin/bash"
    args:
    - '-c'
    - >-
      COOKIE_SECRET=$(openssl rand -base64 32) && OPENSHIFT_SAR="{\"namespace\":\"${DEVWORKSPACE_NAMESPACE}\",\"resource\":\"pods\",\"verb\":\"get\"}" && /usr/bin/oauth-proxy --http-address=:4180 --provider=openshift --https-address= --upstream=http://localhost:8444 --cookie-secret=${COOKIE_SECRET} --cookie-secure=true --pass-basic-auth=false --skip-provider-button=true --client-id=system:serviceaccount:${DEVWORKSPACE_NAMESPACE}:oauth-proxy --client-secret-file=/var/run/oauth-client/token --openshift-ca=/etc/pki/tls/cert.pem --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt --openshift-sar="${OPENSHIFT_SAR}"
    endpoints:
    - exposure: internal
      name: oauth-proxy
      protocol: http
      targetPort: 4180
      attributes:
        discoverable: true
- volume:
    size: 20Gi
  name: projects
commands:
- exec:
    commandLine: export $(dbus-launch) && /usr/bin/google-chrome --display=:0 --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage --disable-plugins --disable-plugins-discovery --disable-notifications --disable-sync --mute-audio --dns-prefetch-disable --noremote --start-maximized
    component: dev-tools
    workingDir: '/projects'
    label: "Start Chrome"
  id: chrome