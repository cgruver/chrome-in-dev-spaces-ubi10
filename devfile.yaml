schemaVersion: 2.3.0
metadata:
  name: devspaces-chrome-oauth
components:
- name: dev-tools
  container:
    image: quay.io/cgruver0/che/chrome-devspaces-ubi10:latest
    memoryLimit: 6Gi
    cpuLimit: 1000m
    mountSources: true
    env:
    - name: SHELL
      value: "/bin/zsh"
    endpoints:
      - exposure: none
        name: kasmvnc
        targetPort: 8444
        protocol: http
- name: oauth-proxy
  container:
    image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
    command: ["tail", "-f", "/dev/null"]
    endpoints:
      - exposure: internal
        name: oauth-proxy
        protocol: http
        targetPort: 4180
        attributes:
          discoverable: true
